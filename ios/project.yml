# The Xcode project is generated from this file with XcodeGen (`xcodegen generate`),
# so there is no project file to merge by hand.
name: LightDecoder
options:
  bundleIdPrefix: com.lightdecoder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  LightDecoderCore:
    path: LightDecoderCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  LightDecoder:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LightDecoderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightdecoder.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LightDecoder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.lightdecoder.ios.refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LightDecoderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LightDecoder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightdecoder.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  LightDecoder:
    build:
      targets:
        LightDecoder: all
        LightDecoderUITests: [test]
    test:
      targets:
        - LightDecoderUITests
