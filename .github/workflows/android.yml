name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Uses the toolchain line of gmbridge/go.mod (a patched go1.26).
          go-version-file: gmbridge/go.mod
          cache-dependency-path: gmbridge/go.sum

      # The platform is needed by gomobile's javac step (android.jar >= 26).
      - name: Install NDK, CMake and SDK platform
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36"

      - name: Go bridge checks (vet, tests, Android cross-build)
        working-directory: gmbridge
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build ./...

      # gomobile silently drops methods whose types it cannot bind and only
      # leaves a "skipped" comment in the generated Java; fail the build if so.
      - name: Build Go bridge (gomobile) and check nothing was skipped
        run: |
          ./gradlew :app:buildGoBridge --no-daemon --stacktrace
          if unzip -p app/libs/gmbridge-sources.jar '*.java' | grep -n skipped; then
            echo "gomobile skipped part of the gmbridge API" >&2
            exit 1
          fi

      - name: Unit tests (decode real HEIC through the Bitmap path)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lightdecoder-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
